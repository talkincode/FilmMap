[package]
name = "filmmap"
version = "0.1.0"
edition = "2024"
description = "Agent-native media capability profiles and evidence indexes"
license = "MIT"

[[bin]]
name = "filmmap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
